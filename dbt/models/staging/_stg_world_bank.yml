version: 2

models:
  - name: stg_world_bank__indicators
    description: >
      World Bank indicators, one row per indicator, country and year.
      Keeps only the most recent extraction when a value was extracted several times.
    columns:
      - name: indicator_id
        description: World Bank indicator code.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["NY.GDP.MKTP.CD", "NY.GDP.PCAP.CD", "FP.CPI.TOTL.ZG", "SP.POP.TOTL", "SL.UEM.TOTL.ZS"]
      - name: country_iso3
        description: ISO 3166-1 alpha-3 country code.
        data_tests:
          - not_null
      - name: year
        description: Reference year of the value.
        data_tests:
          - not_null
      - name: value
        description: Indicator value. Null when the World Bank has not published it yet.